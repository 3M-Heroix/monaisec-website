name = "monaisec-mapper-mail"
main = "index.mjs"
compatibility_date = "2026-11-17"
workers_dev = false
routes = [{ pattern = "api.monaisec.com", custom_domain = true }]

[assets]
directory = "../../assets/reports"
binding = "ASSETS"
run_worker_first = true

[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1001"
simple = { limit = 2, period = 60 }
