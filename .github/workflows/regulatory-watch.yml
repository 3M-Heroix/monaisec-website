name: MONAISEC regulatory source watch
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official source updates
        run: python scripts/update_regulatory_watch.py
      - name: Commit review queue if changed
        run: |
          git config user.name "monaisec-source-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/regulatory-watch.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh regulatory source watch"
            if ! git push; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          fi
