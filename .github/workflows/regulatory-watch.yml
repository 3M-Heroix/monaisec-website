name: MONAISEC regulatory source watch
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official source updates
        run: python scripts/update_regulatory_watch.py
      - name: Commit review queue if changed
        run: |
          git config user.name "monaisec-source-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/regulatory-watch.json
          git diff --cached --quiet || (git commit -m "chore: refresh regulatory source watch" && git push)
