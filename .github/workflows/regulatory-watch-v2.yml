name: MONAISEC regulatory discovery queue
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official-source candidates
        run: python scripts/review_feed.py
      - name: Commit review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regulatory-watch-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh regulatory review queue"
            if ! git push; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          fi
